services:
  mysql:
    image: mysql:8.0
    container_name: healthmate-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: healthmate
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - healthmate_mysql:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: healthmate-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: healthmate-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - healthmate_qdrant:/qdrant/storage

volumes:
  healthmate_mysql:
  healthmate_qdrant:
